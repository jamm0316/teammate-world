<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14111d">
<link rel="manifest" href="manifest.json">
<!-- iOS -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="팀메이트 월드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&family=Jua&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#f3eefb; --mut:#a79cc4;
    --g1:#ff6b6b; --g2:#ffb454; --g3:#2ec4b6; --g4:#8b8bff;
    --hot:#ff7a59; --hot2:#ffb454;
    --o:#3fd6c4; --x:#ff7a8a;
    --basic:#8aa0c8; --rare:#5b8cff; --legend:#ffcf3a;
    --display:'Black Han Sans',sans-serif; --round:'Jua',sans-serif; --body:'Gothic A1',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;min-height:100dvh;color:var(--ink);font-family:var(--body);
    background:radial-gradient(120% 90% at 80% -10%,rgba(255,122,89,.14),transparent 55%),
               radial-gradient(120% 90% at -10% 0%,rgba(139,139,255,.14),transparent 55%),#14111d}
  .app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ============ ONBOARD / GACHA (narrow card) ============ */
  .card{max-width:420px;margin:auto;padding:30px 24px;width:100%;animation:fade .45s ease}
  .logo{font-family:var(--display);font-size:44px;line-height:1.02;
    background:linear-gradient(100deg,var(--hot),var(--hot2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font-family:var(--round);font-size:14px;color:var(--mut);-webkit-text-fill-color:var(--mut);margin-top:8px}
  h2{font-family:var(--round);font-weight:400;font-size:15px;margin:24px 0 8px;color:var(--ink)}
  .field{width:100%;background:#241f37;border:1.5px solid #3a3352;color:var(--ink);border-radius:14px;
    padding:15px 16px;font-size:16px;font-family:var(--body);outline:none}
  .field:focus{border-color:var(--hot)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pick{padding:14px 0;border-radius:14px;border:1.5px solid #3a3352;background:#241f37;
    font-family:var(--round);font-size:15px;color:var(--mut);cursor:pointer;transition:.15s;text-align:center}
  .pick.on{color:#15121f;font-weight:700;transform:translateY(-2px);background:var(--hot);border-color:var(--hot)}
  .pick[data-g="1"].on{background:var(--g1);border-color:var(--g1)}
  .pick[data-g="2"].on{background:var(--g2);border-color:var(--g2)}
  .pick[data-g="3"].on{background:var(--g3);border-color:var(--g3)}
  .pick[data-g="4"].on{background:var(--g4);border-color:var(--g4)}
  .cta{margin-top:26px;width:100%;border:none;border-radius:16px;padding:17px;cursor:pointer;
    font-family:var(--round);font-size:18px;color:#221206;
    background:linear-gradient(100deg,var(--hot),var(--hot2));box-shadow:0 10px 24px -8px rgba(255,122,89,.6)}
  .cta:disabled{filter:grayscale(.7) brightness(.7);box-shadow:none;cursor:not-allowed}
  .ghost{margin-top:10px;width:100%;border:1.5px solid #3a3352;background:transparent;color:var(--mut);
    border-radius:14px;padding:13px;font-family:var(--round);font-size:14px;cursor:pointer}

  /* gacha */
  .gacha{text-align:center}
  .prob{display:flex;justify-content:center;gap:8px;margin:14px 0 20px;flex-wrap:wrap}
  .prob span{font-family:var(--round);font-size:12px;padding:6px 11px;border-radius:20px;background:#241f37;border:1px solid #3a3352}
  .prob .b{color:var(--basic)} .prob .r{color:var(--rare)} .prob .l{color:var(--legend)}
  .orb{width:200px;height:200px;margin:6px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
    position:relative;background:radial-gradient(circle at 35% 30%,#3a3352,#1b1730);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
  .orb.shake{animation:shake .6s ease}
  .reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  .rtag{font-family:var(--display);font-size:30px;margin-top:6px;letter-spacing:1px}
  .rtag.basic{color:var(--basic)} .rtag.rare{color:var(--rare);text-shadow:0 0 16px rgba(91,140,255,.6)}
  .rtag.legend{color:var(--legend);text-shadow:0 0 22px rgba(255,207,58,.8)}
  .rsub{font-family:var(--round);font-size:14px;color:var(--mut);margin-top:2px}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-4deg)}
    40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-5px) rotate(-3deg)}80%{transform:translateX(5px) rotate(3deg)}}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .burst{position:absolute;inset:-20px;border-radius:50%;pointer-events:none}
  .burst.on{animation:burst .6s ease forwards}
  @keyframes burst{from{box-shadow:0 0 0 0 rgba(255,207,58,.55)}to{box-shadow:0 0 0 60px rgba(255,207,58,0)}}

  /* ============ GAME WORLD (portrait, fills viewport) ============ */
  #game{display:none;flex:1;flex-direction:column;animation:fade .4s ease}
  .hud{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px}
  .hud .mark{font-family:var(--display);font-size:18px;background:linear-gradient(100deg,var(--hot),var(--hot2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hud .right{margin-left:auto;display:flex;gap:8px}
  .btn{border:1.5px solid #3a3352;background:#241f37;color:var(--ink);border-radius:12px;
    padding:9px 13px;font-family:var(--round);font-size:13px;cursor:pointer}
  .btn:active{transform:scale(.96)}
  .btn.hot{background:linear-gradient(100deg,var(--hot),var(--hot2));color:#221206;border:none}
  .btn.off{opacity:.5}

  .stage-wrap{padding:0 12px 14px;flex:1;display:flex;flex-direction:column;min-height:0}
  .stage{position:relative;width:100%;flex:1;min-height:0;border-radius:18px;overflow:hidden;cursor:pointer;
    background:#d8c8ac;
    box-shadow:0 18px 50px -12px rgba(0,0,0,.6), inset 0 0 80px rgba(0,0,0,.35);touch-action:none}
  /* the scrolling world (larger than the viewport) — indoor lounge floor */
  .world{position:absolute;left:0;top:0;will-change:transform;transform-origin:0 0;
    background:
      radial-gradient(90% 50% at 50% 12%, rgba(255,255,255,.14), transparent 60%),
      linear-gradient(180deg,#ece0ca 0%, #e2d4ba 55%, #d9cbb0 100%)}
  .grid{position:absolute;inset:0;opacity:.55;
    background-image:repeating-linear-gradient(0deg,rgba(120,92,54,.10) 0 1px,transparent 1px 66px),
                     repeating-linear-gradient(90deg,rgba(120,92,54,.07) 0 1px,transparent 1px 66px)}
  /* window wall with city view */
  .winwall{position:absolute;left:0;top:0;width:100%;height:170px;overflow:hidden;
    border-bottom:7px solid #c7b28a;box-shadow:inset 0 -14px 24px -10px rgba(0,0,0,.25)}
  .winwall .sky{position:absolute;inset:0}
  /* rugs on the floor */
  .rug{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(var(--rc),.30),rgba(var(--rc),.10) 68%,transparent 78%)}
  /* stage + screen */
  .stageplat{position:absolute;border-radius:14px;
    background:linear-gradient(180deg,#caa877,#b5915f);box-shadow:0 10px 22px -10px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25)}
  .screen{position:absolute;border-radius:10px;background:linear-gradient(180deg,#ffffff,#f0f0f6);
    border:6px solid #2a2438;box-shadow:0 12px 26px -8px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
  .scr-logo{font-family:var(--display);font-size:34px;color:#6a4bd0;text-align:center;line-height:1.05}
  .scr-logo span{display:block;font-family:var(--round);font-size:14px;color:#8a7bc0;margin-top:4px}
  .banner{position:absolute;width:56px;height:96px;
    background:linear-gradient(180deg,#8b5cf6,#6d3fd6);display:flex;align-items:center;justify-content:center;
    font-family:var(--round);font-size:15px;color:#fff;text-align:center;line-height:1.1;
    box-shadow:0 8px 16px -6px rgba(0,0,0,.5);clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%)}
  .banner.uni{font-size:30px}
  /* bar counter */
  .barctr{position:absolute;border-radius:12px;background:linear-gradient(90deg,#6d3fd6,#8b5cf6);
    box-shadow:0 10px 22px -10px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2);
    display:flex;align-items:flex-start;justify-content:center}
  .barctr span{margin-top:10px;font-family:var(--display);font-size:15px;color:#fff;letter-spacing:2px;opacity:.85}
  /* furniture */
  .frn{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
  .frn svg{display:block;overflow:visible}
  .seatmark{position:absolute;width:16px;height:9px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
    background:rgba(255,255,255,.4);box-shadow:0 0 8px rgba(255,255,255,.55);animation:seatp 2.2s infinite}
  @keyframes seatp{0%,100%{opacity:.22;transform:translate(-50%,-50%) scale(.8)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.1)}}

  /* zone labels (soft, indoor) */
  .booth{position:absolute;border:none;background:transparent;display:flex;align-items:flex-start;justify-content:center;pointer-events:none}
  .booth .name{margin-top:6px;font-family:var(--round);font-size:13px;color:#5a4a30;
    background:rgba(255,255,255,.55);padding:3px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}

  .pad{position:absolute;transform:translate(-50%,-50%);border-radius:24px;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:48px;transition:box-shadow .25s}
  .pad .lab{position:absolute;top:6px;font-family:var(--round);font-size:11px;opacity:.85}
  .pad.O{background:radial-gradient(circle,rgba(63,214,196,.32),rgba(63,214,196,.10));border:3px solid var(--o);color:var(--o);
    box-shadow:0 0 28px rgba(63,214,196,.35), inset 0 0 30px rgba(63,214,196,.25)}
  .pad.X{background:radial-gradient(circle,rgba(255,122,138,.32),rgba(255,122,138,.10));border:3px solid var(--x);color:var(--x);
    box-shadow:0 0 28px rgba(255,122,138,.35), inset 0 0 30px rgba(255,122,138,.25)}

  /* scoreboard (LED) — fixed to viewport */
  .board{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(92%,520px);
    background:linear-gradient(#0e0c16,#191527);border:1px solid #3a3352;border-radius:14px;
    padding:9px 14px;box-shadow:0 10px 24px -10px #000;z-index:8;transition:padding .2s, width .2s}
  .board .q{font-family:var(--round);font-size:clamp(12px,2.4vw,15px);text-align:center;color:var(--ink);line-height:1.3;padding:0 18px}
  .board .qn{color:var(--hot2);font-size:11px}
  .board .counts{display:flex;justify-content:center;gap:18px;margin-top:6px}
  .board .c{font-family:var(--display);font-size:clamp(20px,5vw,28px);display:flex;align-items:baseline;gap:6px}
  .board .c .t{font-family:var(--round);font-size:13px}
  .board .c.o{color:var(--o)} .board .c.x{color:var(--x)}
  .board .c .v{min-width:28px;text-align:center;text-shadow:0 0 14px currentColor}
  .board .toggle{position:absolute;top:6px;right:8px;width:24px;height:24px;border:none;cursor:pointer;
    background:#2c2640;color:var(--mut);border-radius:8px;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
  .board .toggle:active{transform:scale(.92)}
  .board .body{overflow:hidden;transition:max-height .22s ease, opacity .18s;max-height:120px;opacity:1}
  .board.collapsed{width:min(72%,360px);padding:6px 14px}
  .board.collapsed .body{max-height:0;opacity:0;margin:0}
  .board .mini-q{display:none;font-family:var(--round);font-size:12px;color:var(--mut);text-align:center;padding:0 26px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .board.collapsed .mini-q{display:block}

  /* minimap */
  .mini{position:absolute;right:10px;bottom:10px;width:72px;border:1px solid rgba(90,70,40,.4);
    border-radius:8px;overflow:hidden;z-index:8;background:rgba(226,212,186,.85)}
  .mini canvas{display:block;width:100%}

  .hint{position:absolute;left:10px;bottom:10px;z-index:7;max-width:calc(100% - 102px);
    font-family:var(--round);font-size:12px;color:#fff;background:rgba(0,0,0,.34);padding:6px 14px;border-radius:20px}

  /* avatars live INSIDE .world */
  #avatars{position:absolute;inset:0;pointer-events:none}
  .av{position:absolute;width:56px;height:74px;transform:translate(-50%,-100%);transition:none;z-index:3}
  .av .tag{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--round);font-size:11px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .av .tag .tnm{display:flex;align-items:center;gap:5px}
  .av .tag .ttls{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}
  .av .tag i{font-style:normal;font-size:10px;font-weight:700;color:#15121f;padding:1px 5px;border-radius:7px;line-height:1.3}
  .av .tag i.ttl{background:linear-gradient(100deg,#ffd54a,#ffb454);color:#5a3a00;
    box-shadow:0 0 6px rgba(255,200,60,.6);animation:ttlglow 1.8s ease infinite}
  @keyframes ttlglow{0%,100%{box-shadow:0 0 5px rgba(255,200,60,.5)}50%{box-shadow:0 0 10px rgba(255,210,90,.9)}}
  .av .cbox{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:62px}
  .av .cbox svg{width:100%;height:100%;display:block}
  .av.left .cbox{transform:translateX(-50%) scaleX(-1)}
  .av.moving .cbox{animation:bob .4s infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3px}}
  .av.sitting .cbox{transform:translateX(-50%) translateY(9px) scaleY(.92)}
  .av.sitting.left .cbox{transform:translateX(-50%) translateY(9px) scaleY(.92) scaleX(-1)}
  .av.sitting .tag{background:rgba(139,139,255,.9)}
  .av.sitting .tag .sit{font-size:10px}
  .av.rare .cbox svg{filter:drop-shadow(0 0 4px rgba(92,200,255,.95))}
  .av.legend .cbox svg{filter:drop-shadow(0 0 5px rgba(255,213,74,.95)) drop-shadow(0 0 11px rgba(255,180,40,.55))}
  .av.legend .ring{position:absolute;bottom:2px;left:50%;width:46px;height:18px;transform:translateX(-50%);
    border-radius:50%;border:2px solid rgba(255,213,74,.8);box-shadow:0 0 10px rgba(255,200,60,.6);animation:ring 1.6s infinite}
  @keyframes ring{0%{opacity:.75;transform:translateX(-50%) scale(.8)}100%{opacity:0;transform:translateX(-50%) scale(1.5)}}
  .av .spark{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:twk 1.5s infinite}
  .av.rare .spark{background:radial-gradient(circle,#cdeeff,rgba(205,238,255,0) 70%)}
  .av.legend .spark{background:radial-gradient(circle,#fff3c4,rgba(255,243,196,0) 70%);width:6px;height:6px}
  @keyframes twk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  .av.me .tag{background:rgba(255,122,89,.85)}

  /* gifts (3D) */
  .g3wrap{position:relative;width:150px;height:150px;margin:10px auto 4px;display:flex;align-items:center;justify-content:center;
    font-size:64px;background:radial-gradient(circle at 50% 32%,#322b4c,#1b1730);border:1px solid #3a3352;border-radius:16px;overflow:hidden}
  .g3wrap canvas{position:absolute;inset:0;width:100%;height:100%}
  .g3wrap.sm{width:92px;height:92px;font-size:42px;margin:0;flex:none;border-radius:12px}
  #giftBox{display:none;margin-top:16px;background:#241f37;border:1px solid #3a3352;border-radius:16px;padding:12px 12px 14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  .gtitle{font-family:var(--round);font-size:13px;color:var(--hot2)}
  .gname{font-family:var(--round);font-size:17px;margin-top:4px}
  .gstory{font-size:12px;color:var(--mut);line-height:1.55;margin-top:5px;padding:0 6px}
  .gtoggle{margin-top:14px;background:#241f37;border:1.5px solid #3a3352;border-radius:14px;padding:12px;cursor:pointer;text-align:left;transition:.15s}
  .gtoggle.on{border-color:var(--hot2);background:#2b2340}
  .gtoggle.off{opacity:.55;cursor:default;font-family:var(--round);font-size:13px}
  .gtoggle .gt-head{font-family:var(--round);font-size:14px}
  .gtoggle .gt-story{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5}
  .ngift{display:flex;gap:10px;align-items:center;margin-top:9px;background:#1f1a31;border:1px dashed #4a4168;border-radius:10px;padding:8px}
  .ngift-t{font-family:var(--round);font-size:13px}
  .ngift-t span{font-family:var(--body);font-size:11px;color:var(--mut);line-height:1.45;display:block;margin-top:3px}

  /* lockers (기수 교류존) */
  .locker{position:absolute;width:90px;height:116px;border-radius:10px;border:2px solid rgba(0,0,0,.28);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.25);
    transition:transform .15s}
  .locker:active{transform:scale(.94)}
  .locker .glab{font-family:var(--round);font-size:12px;color:#15121f;background:rgba(255,255,255,.88);
    padding:2px 9px;border-radius:12px;margin-top:8px;white-space:nowrap}
  .locker .slot{width:46px;height:7px;background:rgba(0,0,0,.38);border-radius:3px;margin-top:10px}
  .locker .handle{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75);margin-top:24px;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.3)}
  .locker .badge{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;border-radius:11px;
    background:#ff5c5c;color:#fff;font-family:var(--round);font-size:12px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 3px 8px rgba(0,0,0,.4)}

  /* locker modal */
  .modalbg{position:fixed;inset:0;background:rgba(10,8,18,.6);backdrop-filter:blur(3px);z-index:70;
    display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
  .modal{width:min(96%,460px);max-height:88dvh;overflow-y:auto;background:#1b1730;border:1px solid #3a3352;
    border-radius:18px;padding:18px 18px 22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .modal .mhead{display:flex;align-items:center;gap:8px;font-family:var(--round);font-size:18px}
  .modal .mhead .x{margin-left:auto;border:none;background:#2c2640;color:var(--mut);width:30px;height:30px;
    border-radius:10px;font-size:14px;cursor:pointer}
  .modal h2{margin:16px 0 8px}
  .modal textarea.field{resize:none;height:84px}
  input,textarea{-webkit-user-select:text;user-select:text}
  .notes{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:200px;overflow-y:auto}
  .note{background:#241f37;border:1px solid #3a3352;border-radius:12px;padding:10px 12px}
  .note .to{font-family:var(--round);font-size:13px;color:var(--hot2)}
  .note .txt{font-size:14px;line-height:1.5;margin:4px 0;white-space:pre-wrap;word-break:break-word}
  .note .from{font-size:11px;color:var(--mut);text-align:right}
  .empty{font-size:13px;color:var(--mut);text-align:center;padding:14px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{font-family:var(--round);font-size:12px;padding:6px 12px;border-radius:18px;background:#241f37;
    border:1.5px solid #3a3352;color:var(--mut);cursor:pointer}
  .chip.on{background:var(--hot);border-color:var(--hot);color:#15121f}

  /* 공지 작성(운영자) */
  .ntc-count{font-family:var(--round);font-size:12px;color:var(--mut);text-align:right;margin-top:6px}
  .ntc-count.over{color:#ff7a7a}

const RUGS=[

const SEAT_OFF={

/* ===================== storage layer ===================== */
/* [MX] 백엔드 구현 시: 이 계층 전체가 API 클라이언트로 대체됨.
   - 개인 상태(me 등, sh=false) → REST(JWT 인증, ADR-007)
   - 공유 상태(좌표/공지/쪽지, sh=true) → 용도별로 REST 또는 WS(STOMP)로 분리 (각 호출부 [MX] 참고)
   - 폴링(slist/sget 반복)은 전부 WS subscribe로 교체 — REST 폴링 금지 (ADR-001) */
const HAS=(typeof window!=='undefined'&&window.storage&&typeof window.storage.list==='function');
let SHARED_OK=HAS; const mem={true:{},false:{}};
async function sset(k,v,sh){const val=typeof v==='string'?v:JSON.stringify(v);
  if(HAS){try{await window.storage.set(k,val,sh);return;}catch(e){SHARED_OK=false;}} mem[!!sh][k]=val;}
async function sget(k,sh){if(HAS){try{const r=await window.storage.get(k,sh);return r?r.value:null;}catch(e){return mem[!!sh][k]??null;}} return mem[!!sh][k]??null;}
async function slist(p,sh){if(HAS){try{const r=await window.storage.list(p,sh);return(r&&r.keys)?r.keys:[];}catch(e){SHARED_OK=false;}} return Object.keys(mem[!!sh]).filter(k=>k.startsWith(p));}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== character art ===================== */
function buildChar(c,expr){
  const outfit=c.outfit||'#6c8cff', outfitD=shade(outfit,-24), outfitL=shade(outfit,22);
  const hair=HAIRC[(c.hairCI!=null?c.hairCI:c.hairI)||0]||'#6b4a32', hairD=shade(hair,-28), hairL=shade(hair,30);
  const skin=SKIN[c.skinI||0]||'#ffe0c4', skinD=shade(skin,-16);
  const eye=EYEC[c.eyeI||0]||'#3aa0ff';
  const gender=c.gender||'F', style=c.style||(gender==='M'?'short':'long');
  const shoe='#3a3550', shoeL='#565077', dk='#3a2a38', wt='#ffffff', bl='rgba(255,120,135,.5)', mo='#c47b72', ol='#473a47', eyeline='#7a6470';
  const rareA='#5cc8ff', rareA2='#bdeaff', rareGem='#ff5ca8';
  const legA='#ffd54a', legA2='#fff3c4', legGem='#ff6b6b', wing='#fff6e0';

  const W=44,H=56, g=Array.from({length:H},()=>Array(W).fill(null));
  const inb=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
  const P=(x,y,col)=>{if(inb(Math.round(x),Math.round(y)))g[Math.round(y)][Math.round(x)]=col;};
  const R=(x0,y0,x1,y1,col)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)P(x,y,col);};
  const E=(cx,cy,rx,ry,col)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)P(x,y,col);}};

  // ---- rarity back layer (capes / wings) ----
  if(c.rarity==='rare'){
    R(8,35,14,50,rareA); R(8,50,12,52,rareA);     // flowing cape (back)
    R(8,35,9,50,shade(rareA,-34));                 // inner shadow
    R(13,36,14,49,rareA2);                         // highlight edge
  }
  if(c.rarity==='legend'){
    R(10,31,14,34,wing); R(7,33,12,37,wing); R(5,36,11,40,wing); R(6,40,11,43,wing); // back wing
    P(5,36,legA);P(7,33,legA);P(10,31,legA);P(6,40,legA);
    R(31,32,35,35,wing); R(33,35,37,38,wing); R(35,38,37,40,wing);                    // front wing
    P(37,38,legA);P(35,32,legA);
  }
  // legs + shoes
  R(18,49,20,52,skin); R(24,49,26,52,skin);
  R(17,52,21,54,shoe); R(23,52,27,54,shoe); R(17,52,21,52,shoeL); R(23,52,27,52,shoeL);
  // arms (sleeves) + hands
  R(11,35,13,46,outfit); R(11,35,11,46,outfitD); R(11,46,13,49,skin);
  R(30,35,32,46,outfit); R(32,35,32,46,outfitD); R(30,46,32,49,skin);
  // body + shading
  R(14,34,29,49,outfit); R(15,34,28,35,outfitL); R(14,48,29,49,outfitD);
  R(14,36,14,47,outfitD); R(29,36,29,47,outfitD); R(19,34,24,35,shade(outfit,32));
  // ---- rarity front trim / gem ----
  if(c.rarity==='rare'){ R(14,40,29,40,rareA); R(20,38,23,39,rareGem); P(20,37,rareA2); }
  if(c.rarity==='legend'){ R(14,40,29,40,legA); R(14,34,29,34,legA); R(20,37,23,39,legGem); P(20,37,legA2); }

  // ---- head turned to face the side (3/4, facing right) ----
  // back hair sits toward the back (left); darker rim + lighter core
  E(20,18.5,15,15,hairD); E(20,18,13.7,13.7,hair);
  if(style==='long'||style==='wavy'){R(6,18,10,42,hair); R(31,20,35,40,hair); if(style==='wavy'){R(6,42,8,45,hair);}}
  if(style==='twin'){E(8,30,5,9,hair); E(33,30,4,8,hair); R(6,22,10,24,hairD);}
  if(style==='bun'){E(13,10,6,6,hairD); E(13,10,4.6,4.6,hair); R(8,14,16,30,hair);}
  if(style==='bob'){R(7,20,11,33,hair); R(33,22,36,32,hair);}
  E(15,12,4.5,2.4,hairL); // gloss
  // face skin shifted toward facing side
  E(23,21,13,13,skin);
  // soft nose bump on facing side
  P(35,23,skin); P(35,24,skin); P(34,25,skinD);
  // fringe swept toward the face (kept above the eyes)
  if(style==='spiky'){for(let x=10;x<=36;x++)R(x,7,x,(x%4<2?11:14),hair); R(10,7,36,8,hairD);}
  else if(style==='sweep'){R(10,10,36,13,hair); R(24,13,36,16,hair); R(12,14,34,14,hairD);}
  else{R(10,9,36,13,hair); R(27,13,36,15,hair); for(let x=10;x<=26;x++)R(x,13,x,(x%6<3?14:13),hair); R(12,15,25,15,hairD); E(16,11,4,1.8,hairL);}

  // ---- eyes: gentle & cute, prettier at higher rarity ----
  const tier = c.rarity==='legend' ? 2 : (c.rarity==='rare' ? 1 : 0);
  const eyeAt=(cx,s)=>{
    const ss = s*(1+tier*0.12);              // bigger eyes at higher rarity
    if(tier>=1){ R(cx-2,20,cx+2,20,eyeline); P(cx-3,21,eyeline); P(cx+3,21,eyeline); } // soft upper lash line
    E(cx,23,2.4*ss,3.1,wt);                  // white
    E(cx,23.6,1.9*ss,2.5,shade(eye,18));     // iris outer (lighter)
    E(cx,24,1.5*ss,2.1,eye);                 // iris
    E(cx,24.6,0.75*ss,1.0,dk);               // pupil
    P(cx-1,22,wt);                          // main sparkle
    if(tier>=1){ P(cx+1,25,'rgba(255,255,255,.85)'); } // second highlight (rare+)
    if(tier>=2){ P(cx+2,23,'rgba(255,255,255,.6)'); }  // one extra glimmer (legend)
    P(cx+1,26,'rgba(255,255,255,.4)');       // lower glint
  };
  eyeAt(25,0.82); eyeAt(31,1);
  // ---- eyebrows + mouth: vary by expression (strain/cheer/sad) ----
  const ex=expr||'normal';
  if(ex==='strain'){
    // furrowed brows angled down toward the center
    P(23,19,eyeline); P(24,18.4,eyeline); P(25,18,eyeline); P(26,17.8,eyeline);
    P(30,17.8,eyeline); P(31,18,eyeline); P(32,18.4,eyeline); P(33,19,eyeline);
    // gritted / straining open mouth with a teeth line
    R(25,29,30,31,dk); R(25,29,30,29,wt); P(26,30,wt); P(28,30,wt);
    // sweat bead near the temple
    P(35,18,'#bfe6ff'); P(35,19,'#8fd0ff'); P(35,20,'#6bb8f0');
  } else if(ex==='cheer'){
    // raised, happy brows
    P(24,16.6,eyeline); P(25,16.2,eyeline); P(26,16.4,eyeline);
    P(30,16.4,eyeline); P(31,16.2,eyeline); P(32,16.6,eyeline);
    // big open joyful smile
    R(24,29,31,29,mo); R(25,30,30,31,dk); R(25,30,30,30,wt);
  } else if(ex==='sad'){
    // worried brows (inner ends raised)
    P(24,17.2,eyeline); P(25,17.8,eyeline); P(26,18.2,eyeline);
    P(30,18.2,eyeline); P(31,17.8,eyeline); P(32,17.2,eyeline);
    // downturned frown
    P(25,30,mo); P(26,29,mo); P(27,29,mo); P(28,29,mo); P(29,29,mo); P(30,30,mo);
    // tear running down the front cheek
    P(32,27,'#bfe6ff'); P(32,28,'#8fd0ff'); P(32,29,'#6bb8f0'); P(32,30,'#8fd0ff');
  } else {
    // soft eyebrows (default)
    P(24,18,eyeline); P(25,17.6,eyeline); P(30,17.4,eyeline); P(31,17.6,eyeline); P(32,18,eyeline);
    // centered gentle smile (no pout, no blush)
    P(26,29,mo); P(27,30,mo); P(28,30,mo); P(29,29,mo);   // upturned little smile, centered under nose
  }
  // accessory (head)
  if(c.rarity==='rare'){
    // dangling earring on the visible (front) ear
    P(36,27,rareA2); P(36,28,rareA); P(36,29,rareGem);
    // small hair clip
    P(11,12,rareA); P(12,12,rareA2);
  }
  if(c.rarity==='legend'){
    // ornate jeweled crown
    R(11,5,30,7,legA); R(11,5,30,5,legA2);
    R(13,2,13,5,legA); R(16,1,16,5,legA); R(20,0,20,5,legA); R(24,1,24,5,legA); R(28,2,28,5,legA);
    P(16,0,legA2);P(20,0,legA2);P(24,0,legA2);
    P(13,6,'#6bd0ff');P(16,6,legGem);P(20,5,legA2);P(24,6,legGem);P(28,6,'#6bd0ff'); // crown gems
    // large jeweled earring on visible ear
    P(36,26,legA2); P(37,27,legA); P(37,28,legGem); P(36,29,legGem); P(37,29,legA2);
    // forehead jewel
    P(24,16,legGem); P(24,15,legA2);
  }

  // 1px silhouette outline
  const out=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(g[y][x]!=null)continue;
    if((inb(x-1,y)&&g[y][x-1]!=null)||(inb(x+1,y)&&g[y][x+1]!=null)||(inb(x,y-1)&&g[y-1][x]!=null)||(inb(x,y+1)&&g[y+1][x]!=null)) out.push([x,y]);
  }
  out.forEach(([x,y])=>g[y][x]=ol);
  // soft shadow under feet (empty cells only)
  for(let x=15;x<=28;x++){ if(g[55][x]==null)g[55][x]='rgba(0,0,0,.13)'; }

  // run-length encode to rects
  let rects='';
  for(let y=0;y<H;y++){let x=0;while(x<W){const col=g[y][x];if(col==null){x++;continue;}let x2=x;while(x2+1<W&&g[y][x2+1]===col)x2++;rects+=`<rect x="${x}" y="${y}" width="${x2-x+1}" height="1" fill="${col}"/>`;x=x2+1;}}
  return `<svg viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges">${rects}</svg>`;
}

// pinch-zoom state
let zoom=1, pinching=false, pinchStartDist=0, pinchStartZoom=1, touchCount=0;
const ZMIN=0.45, ZMAX=2.2;
function touchDist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.hypot(dx,dy);}
function bindZoom(){
  const stg=$('#stage');
  stg.addEventListener('touchstart',(e)=>{
    touchCount=e.touches.length;
    if(e.touches.length===2){
      pinching=true; pinchStartDist=touchDist(e.touches); pinchStartZoom=zoom;
      // cancel any pending single-finger move so pinching doesn't walk the character
      if(selfE){selfE.tx=selfE.x; selfE.ty=selfE.y; selfE.pendingSit=null;}
    }
  },{passive:false});
  stg.addEventListener('touchmove',(e)=>{
    if(pinching&&e.touches.length===2){
      e.preventDefault();
      const d=touchDist(e.touches);
      if(pinchStartDist>0) zoom=Math.max(ZMIN,Math.min(ZMAX,pinchStartZoom*(d/pinchStartDist)));
    }
  },{passive:false});
  const end=(e)=>{ touchCount=e.touches.length; if(e.touches.length<2){pinching=false;pinchStartDist=0;} };
  stg.addEventListener('touchend',end); stg.addEventListener('touchcancel',end);
  // trackpad pinch (Mac) / ctrl+wheel — desktop convenience
  stg.addEventListener('wheel',(e)=>{
    if(!e.ctrlKey&&!e.metaKey)return;
    e.preventDefault();
    zoom=Math.max(ZMIN,Math.min(ZMAX,zoom*(1-e.deltaY*0.01)));
  },{passive:false});
}

   +`<div class="pad O" style="left:${PAD_O.cx}px;top:${PAD_O.cy}px;width:${PAD_O.w}px;height:${PAD_O.h}px"><span class="lab">YES</span>O</div>`
   +`<div class="pad X" style="left:${PAD_X.cx}px;top:${PAD_X.cy}px;width:${PAD_X.w}px;height:${PAD_X.h}px"><span class="lab">NO</span>X</div>`;
}
let boardCollapsed=false;
function buildBoard(){
  const b=$('#board');
  b.innerHTML=`<button class="toggle" id="boardToggle">${boardCollapsed?'▾':'▴'}</button>
   <div class="mini-q">⚡ Q${qidx+1} · ${esc(QUESTIONS[qidx])}</div>
   <div class="body">
     <div class="q"><span class="qn">Q${qidx+1}/${QUESTIONS.length} · </span>${esc(QUESTIONS[qidx])}</div>
     <div class="counts"><div class="c o"><span class="t">⭕</span><span class="v" id="cO">0</span></div>
     <div class="c x"><span class="t">❌</span><span class="v" id="cX">0</span></div></div>
   </div>`;

    b.classList.toggle('collapsed',boardCollapsed);

function inPad(x,y,p){return x>=p.cx-p.w/2&&x<=p.cx+p.w/2&&y>=p.cy-p.h/2&&y<=p.cy+p.h/2;}

function onTap(e){
  // ignore taps on overlay UI (scoreboard, minimap, hint, buttons) — only floor taps move the character
  if(e.target.closest('.btn, .board, .mini, .hint'))return;
  const lk=e.target.closest('.locker');
  if(lk){openLocker(+lk.dataset.gen);return;}
  if(pinching||touchCount>1)return;      // ignore taps mid-pinch
  const r=$('#stage').getBoundingClientRect();
  // screen point -> world point (account for camera offset + zoom)
  let wx=cam.x+(e.clientX-r.left)/zoom, wy=cam.y+(e.clientY-r.top)/zoom;
  // tapped near a seat? walk over and sit (unless someone else is there)
  let seat=null,bd=46;
  for(const s of SEATS){const d=Math.hypot(s.x-wx,s.y-wy); if(d<bd){bd=d;seat=s;}}
  if(seat){
    const taken=entities.some(en=>en!==selfE&&(en.sitting===seat.id||en.pendingSit===seat.id));
    if(!taken){selfE.pendingSit=seat.id;selfE.sitting=null;selfE.tx=seat.x;selfE.ty=seat.y;return;}
    toast('이미 누가 앉아 있어요');
  }
  // floor tap: stand up (if seated) and move
  selfE.sitting=null; selfE.pendingSit=null;
  selfE.tx=Math.max(24,Math.min(WORLD.w-24,wx));
  selfE.ty=Math.max(40,Math.min(WORLD.h-12,wy));
}

/* ---- gen lockers (쪽지) ---- */
let lockerRole='mentor';
/* [MX] 백엔드 구현 시: GET /api/lockers/{gen}/notes 붙여야 함 — 쪽지는 영속 데이터이므로 REST(DB 저장).
   좌표(휘발)와 달리 보존가치가 있어 ADR-003 판별식상 DB 대상 */
async function loadNotes(gen){
  const keys=await slist(`note:${gen}:`,true); const notes=[];
  for(const k of keys){ const v=await sget(k,true); if(!v)continue;
    try{notes.push(JSON.parse(v));}catch(e){} }
  return notes.sort((a,b)=>b.ts-a.ts);
}
function openLocker(gen){

  // gift attach toggle (one gift per person — consumed when sent)

  function paintGift(){
    if(!myG){gt.style.display='none';return;}

  }
  gt.onclick=()=>{if(!myG||me.giftSent)return;attachGift=!attachGift;paintGift();};

  async function paint(){
    bg.querySelectorAll('.pick[data-r]').forEach(el=>el.classList.toggle('on',el.dataset.r===lockerRole));
    // quick-pick chips: people of this gen & selected role currently in the world
    const names=[...new Set(entities.filter(e=>e.gen===gen&&(e.role||e.char.role)===lockerRole&&e.kind!=='me').map(e=>e.nick))];

     선물 첨부(giftSent 1회 제한)는 클라 플래그를 믿지 말고 서버가 User 레코드로 검증·차감(중복 전송 차단) */
  bg.querySelector('#noteSend').onclick=async()=>{

/* [MX] 백엔드 구현 시: GET /api/lockers/counts 붙여야 함 — 기수별 쪽지 수 일괄 조회(현재처럼 기수별 slist 반복 금지) */

/* ---- bots ---- */
const BOT_NICKS=['지은','유진','준모','전설','야코','반장','비버','민서','하늘','도윤','서아','태경'];
function spawnBots(){
  if(entities.some(e=>e.kind==='bot'))return;
  const n=9;
  for(let i=0;i<n;i++){
    const gender=Math.random()<.5?'M':'F';
    const b={id:'bot'+i,kind:'bot',nick:BOT_NICKS[i%BOT_NICKS.length],gen:1+Math.floor(Math.random()*4),
      role:Math.random()<.4?'mentor':'mentee',
      char:{gender,...rollChar(gender)},x:200+Math.random()*(WORLD.w-400),y:150+Math.random()*(WORLD.h-300),face:1,nextAt:0};
    b.tx=b.x;b.ty=b.y; entities.push(b); ensureEl(b);
  }
}
function removeBots(){entities=entities.filter(e=>{if(e.kind==='bot'){e.el?.remove();return false;}return true;});}
function botAI(b,now){
  if(now<b.nextAt)return;
  b.nextAt=now+1600+Math.random()*2800;
  b.sitting=null; b.pendingSit=null;
  const roll=Math.random();
  if(roll<0.28){ // grab an empty seat and sit
    const empty=SEATS.filter(s=>!entities.some(en=>en.sitting===s.id||en.pendingSit===s.id));
    if(empty.length){const s=empty[Math.floor(Math.random()*empty.length)]; b.tx=s.x;b.ty=s.y;b.pendingSit=s.id; return;}
  }
  if(roll<0.6){const p=Math.random()<.5?PAD_O:PAD_X; b.tx=p.cx+(Math.random()-.5)*(p.w-30); b.ty=p.cy+(Math.random()-.5)*(p.h-30);}
  else {const z=BOOTHS[Math.floor(Math.random()*BOOTHS.length)]; b.tx=z.x+30+Math.random()*(z.w-60); b.ty=z.y+30+Math.random()*(z.h-60);}
}

/* ---- remote sync ---- */
let lastPush=0;
/* [MX] 백엔드 구현 시: WS(STOMP) publish /app/world/move 붙여야 함 — REST PATCH 아님(ADR-001).
   페이로드는 {x,y,sit}만(프로필·칭호는 입장/변경 시 1회 전송). 서버는 JVM 메모리에만 보관(ADR-003, DB 저장 금지) */
async function pushSelf(){ await sset('p:'+me.id,{nick:me.nick,gen:me.gen,char:me,titles:titlesOf(me),x:Math.round(selfE.x),y:Math.round(selfE.y),sit:selfE.sitting||null,ts:Date.now()},true); }
/* [MX] 백엔드 구현 시: WS(STOMP) subscribe /topic/world.positions 붙여야 함 — 서버 틱이 전원 좌표를 스냅샷 broadcast.
   폴링 제거. 수신 좌표는 지금처럼 tx/ty 목표점으로 넣고 loop()의 보간이 지연을 흡수(ADR-001) */
async function pollRemote(){
  const keys=await slist('p:',true); const now=Date.now(); const seen=new Set();
  for(const k of keys){ const v=await sget(k,true); if(!v)continue; let d;try{d=JSON.parse(v);}catch(e){continue;}
    const id=k.slice(2); if(id===me.id)continue; if(now-d.ts>12000)continue; seen.add(id);
    let e=entities.find(x=>x.id===id);
    const dTitles=titlesOf(d);
    if(!e){e={id,kind:'remote',nick:d.nick,gen:d.gen,char:d.char,titles:dTitles,x:d.x,y:d.y,tx:d.x,ty:d.y,face:1,sitting:d.sit||null};entities.push(e);ensureEl(e);}
    else {e.tx=d.x;e.ty=d.y;e.sitting=d.sit||null; if(dTitles.join(',')!==(e.titles||[]).join(',')){e.titles=dTitles; if(e.el){const tag=e.el.querySelector('.tag'); if(tag)tag.outerHTML=tagHTML(e);}}}
  }
  entities=entities.filter(e=>{if(e.kind==='remote'&&!seen.has(e.id)){e.el?.remove();return false;}return true;});
}

/* ---- 공지 (운영자 → 전체) ---- */
const NOTICE_KEY='notice:live';   // 최신 공지 1건만 유지
const NOTICE_MAX=30;              // 공지 글자 수 제한
const NOTICE_SHOW=4000;           // 화면에 떠 있는 시간(ms)
const NOTICE_FRESH=15000;         // 이보다 오래된 공지는 띄우지 않음(뒤늦은 폴링 대비)
let noticeSeenTs=0;               // 이미 표시한 공지의 ts

// 입장 시점의 공지는 '이미 본 것'으로 처리 — 과거 공지가 다시 뜨지 않도록
/* [MX] 백엔드 구현 시: WS(STOMP) subscribe /topic/notice 붙여야 함 — pollNotice 폴링 제거.
   push 수신이라 NOTICE_FRESH/noticeSeenTs 같은 뒤늦은-폴링 보정 로직도 함께 제거 가능 */
async function initNotice(){
  const d=await readNotice(); if(d)noticeSeenTs=d.ts;
  setInterval(pollNotice,1500);
}
async function readNotice(){
  const v=await sget(NOTICE_KEY,true); if(!v)return null;
  try{const d=JSON.parse(v);return d&&d.ts?d:null;}catch(e){return null;}
}
async function pollNotice(){
  const d=await readNotice(); if(!d||d.ts<=noticeSeenTs)return;
  noticeSeenTs=d.ts;
  if(Date.now()-d.ts>NOTICE_FRESH)return; // 한참 지난 공지는 조용히 흘려보냄
  showNotice(d);
}
// 화면 중앙 전광판 — 크게 떴다가 사라짐
function showNotice(d){

    <div class="msg">${esc(d.text)}</div>
    <div class="by">${esc(d.from||'운영자')}</div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ov.classList.add('out');setTimeout(()=>ov.remove(),500);},NOTICE_SHOW);
}
function openNoticeComposer(){

     전파는 서버가 WS(STOMP) /topic/notice 로 broadcast. 클라가 직접 공유 상태에 쓰지 않음 */
  bg.querySelector('#ntcSend').onclick=async()=>{

    noticeSeenTs=d.ts; // 폴링으로 중복 표시되지 않게

/* ---- DOM + loop ---- */
function ensureEl(e){
  if(e.el)return;
  const d=document.createElement('div');
  d.className='av '+e.char.rarity+(e.kind==='me'?' me':'');
  let fx='';
  if(e.char.rarity==='legend') fx='<div class="ring"></div>'
    +'<div class="spark" style="top:5px;right:3px"></div>'
    +'<div class="spark" style="top:20px;left:1px;animation-delay:.5s"></div>'
    +'<div class="spark" style="top:3px;left:13px;animation-delay:.95s"></div>';
  else if(e.char.rarity==='rare') fx='<div class="spark" style="top:7px;right:5px"></div>'
    +'<div class="spark" style="top:22px;left:3px;animation-delay:.6s"></div>';
  d.innerHTML=tagHTML(e)+fx+`<div class="cbox">${buildChar(e.char)}</div>`;
  $('#avatars').appendChild(d); e.el=d;
}
// 보유 칭호 배열로 정규화(구버전 단일 title 필드도 흡수)
function titlesOf(e){
  const t=e.titles||(e.char&&e.char.titles);
  if(Array.isArray(t))return t;
  const single=e.title||(e.char&&e.char.title);
  return single?[single]:[];
}
function titleBadge(t){ return t.includes('계주')?'🏃 달인':'🪢 달인'; }
// 이름표 마크업(칭호 뱃지는 이름 윗줄에 별도 표시) — self/remote 공용
function tagHTML(e){
  const role=e.role||(e.char&&e.char.role);
  const titles=titlesOf(e);
  const ttls=titles.length?`<div class="ttls">${titles.map(t=>`<i class="ttl" title="${esc(t)}">${titleBadge(t)}</i>`).join('')}</div>`:'';
  return `<div class="tag">${ttls}<div class="tnm"><i style="background:${GENC[e.gen]}">${GEN[e.gen]}</i>${role?`<i style="background:${role==='admin'?'#ffd7a1':'#e8e2f6'}">${ROLE[role]}</i>`:''}${esc(e.nick)}</div></div>`;
}
// 종목 우승 등으로 칭호를 부여하고 즉시 반영(저장·이름표·브로드캐스트)
/* [MX] 백엔드 구현 시: 클라 자가 부여 제거 — 서버가 경기 판정 결과로 칭호를 부여하고(서버 권위, ADR-006)
   WS(STOMP) 개인 큐 /user/queue/titles 로 수신해야 함. 이 함수는 '수신 후 UI 반영'만 남김 */
async function awardTitle(t){
  if(!me)return;
  const cur=titlesOf(me);
  if(cur.includes(t))return;
  me.titles=[...cur,t]; delete me.title; await sset('me',me,false);
  if(selfE){ selfE.titles=me.titles; if(selfE.el){ const tag=selfE.el.querySelector('.tag'); if(tag)tag.outerHTML=tagHTML(selfE); } }
  pushSelf();
}
let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t; const now=Date.now();
  let o=0,x=0;
  for(const e of entities){
    if(e.kind==='bot')botAI(e,now);
    const el=e.el;
    if(e.sitting){ // pinned to the seat
      const s=SEATBYID[e.sitting];
      if(s){e.x=s.x;e.y=s.y;e.tx=s.x;e.ty=s.y;e.face=s.face;}
      el.style.left=e.x+'px'; el.style.top=e.y+'px'; el.style.zIndex=Math.round(e.y);
      el.classList.add('sitting'); el.classList.remove('moving'); el.classList.toggle('left',e.face<0);
      if(inPad(e.x,e.y,PAD_O))o++; else if(inPad(e.x,e.y,PAD_X))x++;
      continue;
    }
    el.classList.remove('sitting');
    const dx=e.tx-e.x, dy=e.ty-e.y, dist=Math.hypot(dx,dy);
    const moving=dist>2;
    if(moving){const s=Math.min(dist,SPEED*dt);e.x+=dx/dist*s;e.y+=dy/dist*s;if(Math.abs(dx)>1)e.face=dx<0?-1:1;}
    else if(e.pendingSit){e.sitting=e.pendingSit;e.pendingSit=null;} // arrived → sit
    if(inPad(e.x,e.y,PAD_O))o++; else if(inPad(e.x,e.y,PAD_X))x++;
    el.style.left=e.x+'px'; el.style.top=e.y+'px'; el.style.zIndex=Math.round(e.y);
    el.classList.toggle('moving',moving); el.classList.toggle('left',e.face<0);
  }
  // camera follows self, clamped to world bounds (visible area shrinks/grows with zoom)
  const visW=view.w/zoom, visH=view.h/zoom;
  let tcx=selfE.x-visW/2, tcy=selfE.y-visH/2;
  tcx = visW>=WORLD.w ? (WORLD.w-visW)/2 : Math.max(0,Math.min(WORLD.w-visW,tcx));
  tcy = visH>=WORLD.h ? (WORLD.h-visH)/2 : Math.max(0,Math.min(WORLD.h-visH,tcy));
  cam.x+=(tcx-cam.x)*Math.min(1,dt*8); cam.y+=(tcy-cam.y)*Math.min(1,dt*8);
  $('#world').style.transform=`scale(${zoom}) translate(${-cam.x}px,${-cam.y}px)`;

  const cO=$('#cO'),cX=$('#cX');
  if(cO&&cO.textContent!=String(o))cO.textContent=o;
  if(cX&&cX.textContent!=String(x))cX.textContent=x;
  drawMini();
  requestAnimationFrame(loop);
}
function drawMini(){
  const cv=$('#miniC'); if(!cv)return; const ctx=cv.getContext('2d');
  const sx=cv.width/WORLD.w, sy=cv.height/WORLD.h;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#e2d4ba'; ctx.fillRect(0,0,cv.width,cv.height);              // floor
  ctx.fillStyle='rgba(150,190,230,.55)'; ctx.fillRect(0,0,cv.width,7*sy);    // window wall
  // furniture blocks
  ctx.fillStyle='rgba(90,70,40,.5)';
  FURNITURE.forEach(f=>ctx.fillRect((f.x-14)*sx,(f.y-14)*sy,28*sx,12*sy));
  // pads
  ctx.fillStyle='rgba(63,214,196,.8)'; ctx.fillRect((PAD_O.cx-PAD_O.w/2)*sx,(PAD_O.cy-PAD_O.h/2)*sy,PAD_O.w*sx,PAD_O.h*sy);
  ctx.fillStyle='rgba(255,122,138,.8)'; ctx.fillRect((PAD_X.cx-PAD_X.w/2)*sx,(PAD_X.cy-PAD_X.h/2)*sy,PAD_X.w*sx,PAD_X.h*sy);
  // viewport rect
  ctx.strokeStyle='rgba(60,40,20,.8)'; ctx.lineWidth=1;
  ctx.strokeRect(cam.x*sx,cam.y*sy,(view.w/zoom)*sx,(view.h/zoom)*sy);
  // entities
  for(const e of entities){ ctx.fillStyle = e.kind==='me'?'#ff7a59':(GENC[e.gen]||'#fff');
    const r=e.kind==='me'?2.5:1.6; ctx.beginPath(); ctx.arc(e.x*sx,e.y*sy,r,0,7); ctx.fill(); }
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}

<script type="importmap">

<script type="module">
/* ===================== gift 3D viewer =====================
   One shared WebGL renderer; each gift canvas is a plain 2D canvas
   that gets the rendered frame copied in (avoids the browser's
   WebGL-context limit when many notes carry gifts). */
import * as THREE from 'three';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';

let renderer,scene,cam,pivot,inited=false;
function init(){
  if(inited)return; inited=true;
  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setSize(300,300); renderer.setPixelRatio(1);
  scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,1.2));
  const dl=new THREE.DirectionalLight(0xffffff,1.8); dl.position.set(2,4,3); scene.add(dl);
  cam=new THREE.PerspectiveCamera(35,1,0.1,100); cam.position.set(0,1.2,4.2); cam.lookAt(0,0.7,0);
  pivot=new THREE.Group(); scene.add(pivot);
}
const cache={}; // gift id -> Promise<Object3D>
function loadModel(g){
  if(cache[g.id])return cache[g.id];
  cache[g.id]=new Promise((res,rej)=>{
    new MTLLoader().load(g.mtl,mats=>{
      mats.preload();
      Object.values(mats.materials).forEach(m=>{m.transparent=false;m.opacity=1;}); // guard against d=0 exports
      const lo=new OBJLoader(); lo.setMaterials(mats);
      lo.load(g.obj,obj=>{
        const box=new THREE.Box3().setFromObject(obj);
        const size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
        const s=1.7/Math.max(size.x,size.y,size.z);
        obj.scale.setScalar(s);
        obj.position.set(-c.x*s,-box.min.y*s,-c.z*s); // centered, standing on y=0
        res(obj);
      },undefined,rej);
    },undefined,rej);
  });
  return cache[g.id];
}
let views=[],mountedId=null,looping=false;
function tick(){
  views=views.filter(v=>v.canvas.isConnected); // drop canvases removed with their modal
  if(!views.length){looping=false;return;}
  pivot.rotation.y+=0.018;
  renderer.render(scene,cam);
  for(const v of views){
    v.ctx.clearRect(0,0,v.canvas.width,v.canvas.height);
    v.ctx.drawImage(renderer.domElement,0,0,v.canvas.width,v.canvas.height);
  }
  requestAnimationFrame(tick);
}
window.Gift3D={
  async mount(canvas,g){
    try{
      init();
      const obj=await loadModel(g);
      if(mountedId!==g.id){pivot.clear();pivot.add(obj);mountedId=g.id;}
    }catch(e){return false;} // e.g. opened from file:// — emoji fallback shows instead
    if(!canvas.isConnected)return true;
    views.push({canvas,ctx:canvas.getContext('2d')});
    if(!looping){looping=true;requestAnimationFrame(tick);}
    return true;
  }
};
</script>
